# configuration file /etc/nginx/sites-enabled/web-saas:
# zhizhuan web-saas 反代
# 域名: y.eforge.xyz → 127.0.0.1:8802 (Next.js)

upstream web_saas_node {
    server 127.0.0.1:8802;
    keepalive 32;
}

server {
    server_name y.eforge.xyz;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 20m;

    location / {
        proxy_pass http://web_saas_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Next.js 静态资源缓存
    location /_next/static/ {
        proxy_pass http://web_saas_node;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/x.eforge.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/x.eforge.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = y.eforge.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name y.eforge.xyz;
    return 404; # managed by Certbot


}

