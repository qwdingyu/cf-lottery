# configuration file /etc/nginx/sites-enabled/cf-auth:
# cf-auth nginx 反代
# 域名: auth.eforge.xyz -> 127.0.0.1:8788

upstream cf_auth_node {
    server 127.0.0.1:8788;
    keepalive 32;
}

server {
    server_name 38.47.198.72 auth.eforge.xyz;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 2m;

    # gzip JSON 响应
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json;

    location / {
        proxy_pass http://cf_auth_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/auth.eforge.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.eforge.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = auth.eforge.xyz) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name auth.eforge.xyz;
    return 301 https://$server_name$request_uri;
}

# configuration file /etc/letsencrypt/options-ssl-nginx.conf:
# This file contains important security parameters. If you modify this file
# manually, Certbot will be unable to automatically provide future security
# updates. Instead, Certbot will print and log an error message with a path to
# the up-to-date file that you will need to refer to when manually updating
# this file. Contents are based on https://ssl-config.mozilla.org

ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

# configuration file /etc/nginx/sites-enabled/cf-lottery:
# cf-lottery nginx 反代
# 上游: systemd → 127.0.0.1:8787
# 域名: lucky.eforge.xyz

upstream cf_lottery_node {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    server_name lucky.eforge.xyz;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 10m;

    # ── 静态资源：长缓存 + gzip ──
    location /assets/ {
        # 移除上游可能设置的短缓存头，强制 immutable
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";

        proxy_pass http://cf_lottery_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # ── 其他请求 ──
    location / {
        proxy_pass http://cf_lottery_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # gzip 压缩 JS/CSS（vite 构建产物已 hash 命名，可安全缓存）
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/javascript application/javascript text/css;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/lucky.eforge.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucky.eforge.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = lucky.eforge.xyz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name lucky.eforge.xyz;
    return 404;
}

