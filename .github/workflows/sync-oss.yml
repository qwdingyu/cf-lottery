name: sync-oss-to-xshop

on:
  push:
    branches: [main]
  workflow_dispatch:

# 仅私有源仓应运行；公开模板不应包含此文件（export 会排除）
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require OSS_SYNC_TOKEN
        env:
          OSS_SYNC_TOKEN: ${{ secrets.OSS_SYNC_TOKEN }}
        run: |
          if [ -z "$OSS_SYNC_TOKEN" ]; then
            echo "OSS_SYNC_TOKEN 未配置，跳过同步（非失败，避免阻塞主开发）"
            echo "skip=1" >> "$GITHUB_ENV"
          else
            echo "skip=0" >> "$GITHUB_ENV"
          fi

      - name: Export + push scrubbed snapshot
        if: env.skip == '0'
        env:
          OSS_SYNC_TOKEN: ${{ secrets.OSS_SYNC_TOKEN }}
          XSHOP_OWNER: qwdingyu
          XSHOP_REPO: xshop
          XSHOP_BRANCH: main
          OSS_STRIP_SCHEDULE: "1"
        run: |
          chmod +x scripts/oss/ossctl.sh
          ./scripts/oss/ossctl.sh sync